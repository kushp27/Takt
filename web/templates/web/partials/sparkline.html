{% comment %}Design review D22: 14-day sparkline. Pace in ink, yield in --text-2 grey, each with a faint ±1 SD
baseline band; today's point is marked. The accessible name is the API's trend_text. Hidden on phones (D19).{% endcomment %}<svg class="sparkline" role="img" aria-label="{{ label }}" width="{{ spark.width }}" height="{{ spark.height }}" viewBox="0 0 {{ spark.width }} {{ spark.height }}" focusable="false"><title>{{ label }}</title>{% if not spark.empty %}{% if spark.pace.band %}<rect class="spark-band spark-band-pace" x="0" y="{{ spark.pace.band.0 }}" width="{{ spark.width }}" height="{{ spark.pace.band.1 }}"/>{% endif %}{% if spark.yield_.band %}<rect class="spark-band spark-band-yield" x="0" y="{{ spark.yield_.band.0 }}" width="{{ spark.width }}" height="{{ spark.yield_.band.1 }}"/>{% endif %}{% for seg in spark.yield_.segments %}<polyline class="spark-yield" points="{{ seg }}"/>{% endfor %}{% for seg in spark.pace.segments %}<polyline class="spark-pace" points="{{ seg }}"/>{% endfor %}{% if spark.yield_.last %}<circle class="spark-today spark-today-yield" cx="{{ spark.yield_.last.0 }}" cy="{{ spark.yield_.last.1 }}" r="2"/>{% endif %}{% if spark.pace.last %}<circle class="spark-today spark-today-pace" cx="{{ spark.pace.last.0 }}" cy="{{ spark.pace.last.1 }}" r="2"/>{% endif %}{% endif %}</svg>
