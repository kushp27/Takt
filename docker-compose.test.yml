# Test override: runs pytest inside the test image against the compose Postgres (eng review D8).
#   docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm web pytest
# Use -p <name> to give parallel worktrees their own Postgres.
services:
  web:
    build:
      target: test
    image: takt:test
    environment:
      DJANGO_SECRET_KEY: test-only-not-a-secret  # settings refuse the dev default outside DEBUG
    ports: !reset []
    volumes:
      - .:/app
    command: ["pytest"]
    healthcheck:
      disable: true
  scheduler:
    profiles: ["never"]
