[pytest]
DJANGO_SETTINGS_MODULE = takt.settings
python_files = test_*.py
testpaths = tests
addopts = -ra --strict-markers
markers =
    mes_engine: needs an anonymized MES extract in a container of the hub's own engine (eng review D8); skipped until Open Question 1 is answered
filterwarnings =
    ignore:No directory at.*staticfiles:UserWarning
