{% extends "web/base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
<form method="post">
  {% csrf_token %}
  {% if form.errors %}<p role="alert">Your username and password didn't match.</p>{% endif %}
  <p><label for="id_username">Username</label><br>{{ form.username }}</p>
  <p><label for="id_password">Password</label><br>{{ form.password }}</p>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
