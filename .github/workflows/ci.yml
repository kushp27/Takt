name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: takt
          POSTGRES_USER: takt
          POSTGRES_PASSWORD: takt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U takt -d takt" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      POSTGRES_HOST: localhost
      DJANGO_SECRET_KEY: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile --target prod -t takt:${{ github.sha }} .
